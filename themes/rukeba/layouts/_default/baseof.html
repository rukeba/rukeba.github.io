<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
    {{- partial "head.html" . }}
</head>
<body>
    <div class="container">
        {{- partial "header.html" . }}
        <main id="content">
            {{- block "main" . }}{{- end }}
        </main>
        {{- partial "footer.html" . }}
    </div>
    {{- partial "custom-scripts.html" . }}
    {{- if .Site.Params.googleAnalytics }}
        {{- partial "google-analytics.html" . }}
    {{- end }}
</body>
</html>

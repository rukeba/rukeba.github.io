{{- define "main" }}
<article class="post post-full">
    <div class="post">
        <h1 class="post-title">{{ .Title }}</h1>
        <div class="post-meta">
            <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
                {{- .Date.Format .Site.Params.dateFormat }}
            </time>
            {{- if .Params.tags }}
                <div class="post-tags">
                    {{- range .Params.tags }}
                        <a href="{{ (printf "/%s/tags/%s/" .Site.Section (. | urlize)) | relURL }}" class="tag">{{ . }}</a>
                    {{- end }}
                </div>
            {{- end }}
        </div>
        <div class="post-content">
            {{- .Content }}
        </div>
    </div>
</article>
{{- end }}
